name: AC CI · 自动交付流水线

on:
  push:
    branches: [main, master]
    paths:
      - 'ac/**'
      - '.github/workflows/ac-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'ac/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ── Stage 1: 代码检查 ──
  lint:
    name: Lint & Format
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type Check (mypy strict)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Run mypy strict
        run: mypy . --config-file=00-AC/config/mypy.ini --strict

  # ── Stage 2: 测试 ──
  test:
    name: Tests
    runs-on: windows-latest
    needs: [lint, typecheck]
    defaults:
      run:
        working-directory: ac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 00-AC/config/requirements.txt
          pip install pytest

      - name: Run test suite
        run: python run_tests.py

      - name: R10 meltdown: SQL hijack test
        run: python -m pytest tests/test_sql_hijack.py -v

  # ── Stage 3: 架构扫描 ──
  archguard:
    name: ArchGuard Full Scan
    runs-on: windows-latest
    needs: [test]
    defaults:
      run:
        working-directory: ac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 00-AC/config/requirements.txt

      - name: Run ArchGuard full scan
        run: python -c "from archguard import get_guard; r = get_guard().full_scan(); print(r['overall']); assert r['overall'] == 'PASS', f'ArchGuard FAIL: {r}'"

      - name: Run CloudGuard scan
        run: python -c "from cloud_guard import get_cloud_guard; r = get_cloud_guard().scan(); print(r.get('status', 'UNKNOWN'))"

  # ── Stage 4: 构建验证 ──
  build:
    name: Build & Verify
    runs-on: windows-latest
    needs: [archguard]
    defaults:
      run:
        working-directory: ac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Verify core imports
        run: |
          python -c "from ac.core import dispatch; r = dispatch('test'); assert r.get('status') == 'error', f'dispatch returned {r.get(\"status\")}'"

      - name: Verify governance pipeline
        run: |
          python -c "from ac.governance import pipeline; r = pipeline('{\"status\":\"ok\"}'); print('gov:', r['passed'])"
