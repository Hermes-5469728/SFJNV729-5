name: Deploy - GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**.md'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material markdownlit

      - name: Build site
        run: |
          if [ -f "mkdocs.yml" ]; then
            mkdocs build --strict
          elif [ -d "docs" ]; then
            echo "构建文档站点..."
            # 如果是纯 Markdown，复制到 site/
            mkdir -p site
            cp -r docs/* site/ 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify completion
        run: |
          echo "部署完成: ${{ steps.deployment.outputs.page_url }}"
