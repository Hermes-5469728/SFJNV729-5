site_name: Hermes · 架构笔记
site_description: AI架构、数字孪生、治理管道 — 一个人的技术博客
site_author: Hermes
site_url: https://hermes-5469728.github.io/SFJNV729-5/
copyright: '&copy; 2026 Hermes · 保留所有权利'

repo_name: Hermes-5469728/SFJNV729-5
repo_url: https://github.com/Hermes-5469728/SFJNV729-5

theme:
  name: material
  language: zh
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - blog:
      blog_dir: blog
      blog_toc: true
      archive: true
      categories: true
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - def_list

nav:
  - 首页: index.md
  - 博客: blog/index.md
  - 关于: about.md
