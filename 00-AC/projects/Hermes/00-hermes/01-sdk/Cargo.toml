[package]
name = "digital_twin_sdk"
version = "0.1.0"
edition = "2021"
description = "个人数字孪生底座 - 通用SDK框架"
authors = ["SDK Team <team@example.com>"]
license = "MIT"
repository = "https://github.com/example/digital_twin_sdk"

[dependencies]
async-trait = "0.1.74"
casbin = { version = "2.0", features = ["runtime-async-std"] }
lancedb = "0.10"
rusqlite = { version = "0.29", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
assert_cmd = "2.0"
predicates = "3.0"

[features]
default = ["casbin", "lancedb", "sqlite"]
casbin = ["dep:casbin"]
lancedb = ["dep:lancedb"]
sqlite = ["dep:rusqlite"]