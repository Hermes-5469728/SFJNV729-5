<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes 对话</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; background: #0a0a0f; color: #d4d4d8; height: 100vh; display: flex; flex-direction: column; font-size: 14px; line-height: 1.6; }

/* tabs */
.tab-bar { display: flex; background: #121218; border-bottom: 1px solid #1e1e26; padding: 0; overflow-x: auto; flex-shrink: 0; }
.tab { padding: 10px 18px; cursor: pointer; color: #71717a; border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13px; user-select: none; display: flex; align-items: center; gap: 8px; }
.tab:hover { color: #a1a1aa; background: #18181d; }
.tab.active { color: #e4e4e7; border-bottom-color: #6366f1; background: #18181d; }
.tab .close { font-size: 14px; color: #52525b; cursor: pointer; padding: 0 2px; }
.tab .close:hover { color: #ef4444; }
.tab-new { padding: 10px 14px; cursor: pointer; color: #52525b; font-size: 18px; user-select: none; }
.tab-new:hover { color: #a1a1aa; background: #18181d; }

/* model selector & user badge */
.top-bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #121218; border-bottom: 1px solid #1e1e26; flex-shrink: 0; }
select { background: #1e1e26; color: #d4d4d8; border: 1px solid #2a2a34; border-radius: 4px; padding: 4px 8px; font-size: 12px; font-family: inherit; }
.user-badge { font-size: 11px; color: #52525b; margin-left: auto; }

/* messages */
#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.msg { padding: 8px 12px; line-height: 1.7; }
.msg.user { color: #818cf8; }
.msg.assistant { color: #d4d4d8; }
.msg .prefix { color: #52525b; margin-right: 8px; }
.msg .body { white-space: pre-wrap; word-break: break-word; }
.msg .time { font-size: 11px; color: #3f3f46; margin-left: 8px; }
.msg.error { color: #f87171; font-size: 13px; text-align: center; padding: 12px; }

/* input */
.bottom { padding: 12px 16px; background: #121218; border-top: 1px solid #1e1e26; flex-shrink: 0; }
form { display: flex; gap: 8px; }
#input { flex: 1; background: #1a1a22; color: #e4e4e7; border: 1px solid #2a2a34; border-radius: 4px; padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; }
#input:focus { border-color: #6366f1; }
button { background: #6366f1; color: #fff; border: none; border-radius: 4px; padding: 10px 18px; font-size: 13px; cursor: pointer; font-weight: 500; font-family: inherit; }
button:disabled { opacity: .4; cursor: not-allowed; }
button:hover:not(:disabled) { background: #4f46e5; }

/* typing */
.typing { padding: 8px 12px; color: #52525b; }
.dots { display: inline-flex; gap: 3px; }
.dots span { width: 5px; height: 5px; background: #52525b; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
.dots span:nth-child(2) { animation-delay: -0.16s; }
.dots span:nth-child(3) { animation-delay: -0.32s; }
@keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a34; border-radius: 2px; }
</style>
</head>
<body>
<div class="tab-bar" id="tabBar">
  <div class="tab-new" id="btnNewTab" title="新会话">+</div>
</div>
<div class="top-bar">
  <select id="model">
    <option value="ac-jarvis">AC Jarvis</option>
    <option value="deepseek-chat">DeepSeek</option>
  </select>
  <span class="user-badge" id="userBadge"></span>
</div>
<div id="messages"></div>
<div class="bottom">
  <form id="form">
    <input id="input" placeholder="输入消息..." autofocus>
    <button type="submit">发送</button>
  </form>
</div>
<script>
const STORAGE_KEY = 'hermes_chat_sessions';
const USER_ID_KEY = 'hermes_user_id';

// ── user_id (持久化，跨会话共享) ──
function getUserId() {
  let uid = localStorage.getItem(USER_ID_KEY);
  if (!uid) {
    uid = 'user_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    localStorage.setItem(USER_ID_KEY, uid);
  }
  return uid;
}
const USER_ID = getUserId();
document.getElementById('userBadge').textContent = 'ID: ' + USER_ID.slice(0, 12);

// ── session manager ──
let sessions = [];
let activeId = null;

function loadSessions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    sessions = raw ? JSON.parse(raw) : [];
  } catch { sessions = []; }
  if (!sessions.length) {
    sessions.push({ id: 's1', name: '会话 1', messages: [], createdAt: Date.now() });
    activeId = 's1';
  }
  if (!activeId || !sessions.find(s => s.id === activeId)) {
    activeId = sessions[0].id;
  }
}

function saveSessions() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
}

function getActive() { return sessions.find(s => s.id === activeId); }

function renderTabs() {
  const bar = document.getElementById('tabBar');
  const btnNew = bar.querySelector('#btnNewTab');
  // remove old tabs (keep btnNew)
  bar.querySelectorAll('.tab').forEach(t => t.remove());
  sessions.forEach(s => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (s.id === activeId ? ' active' : '');
    tab.innerHTML = `<span>${s.name}</span><span class="close" data-id="${s.id}">×</span>`;
    tab.addEventListener('click', (e) => {
      if (e.target.classList.contains('close')) return;
      switchTab(s.id);
    });
    tab.querySelector('.close').addEventListener('click', (e) => {
      e.stopPropagation();
      closeTab(s.id);
    });
    bar.insertBefore(tab, btnNew);
  });
}

function switchTab(id) {
  if (id === activeId) return;
  saveMessages(); // save current messages
  activeId = id;
  renderTabs();
  renderMessages();
  document.getElementById('input').focus();
}

function closeTab(id) {
  if (sessions.length <= 1) return;
  sessions = sessions.filter(s => s.id !== id);
  if (activeId === id) activeId = sessions[0].id;
  saveSessions();
  renderTabs();
  renderMessages();
}

function newTab() {
  const num = sessions.length + 1;
  const id = 's' + Date.now().toString(36);
  sessions.push({ id, name: '会话 ' + num, messages: [], createdAt: Date.now() });
  saveMessages(); // save old
  activeId = id;
  saveSessions();
  renderTabs();
  renderMessages();
  document.getElementById('input').focus();
}

// ── messages ──
function saveMessages() {
  const container = document.getElementById('messages');
  // messages are already saved on send, but save current scroll on switch
}

function renderMessages() {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  const sess = getActive();
  if (!sess) return;
  sess.messages.forEach(m => appendMessageDOM(m.role, m.content, false));
  container.scrollTop = container.scrollHeight;
}

function appendMessageDOM(role, content, save = true) {
  const container = document.getElementById('messages');
  // remove typing indicator if present
  const typing = document.getElementById('typing-indicator');
  if (typing) typing.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const prefix = role === 'user' ? '▶' : '·';
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `<span class="prefix">${prefix}</span><span class="body">${escapeHtml(content)}</span><span class="time">${time}</span>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;

  if (save) {
    const sess = getActive();
    if (sess) {
      sess.messages.push({ role, content, time });
      saveSessions();
    }
  }
}

function showTyping() {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing-indicator';
  div.innerHTML = '<span class="prefix">·</span><span class="dots"><span></span><span></span><span></span></span>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// ── chat API ──
let loading = false;

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || loading) return;
  input.value = '';
  loading = true;

  appendMessageDOM('user', text);
  showTyping();

  const sess = getActive();
  // build messages array: last N messages for context
  const history = sess ? sess.messages.slice(-10) : [];
  const msgs = history.map(m => ({ role: m.role, content: m.content }));
  msgs.push({ role: 'user', content: text });

  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: document.getElementById('model').value,
        messages: msgs,
        user_id: USER_ID,
        session_id: sess ? sess.id : '',
      }),
    });
    const typing = document.getElementById('typing-indicator');
    if (typing) typing.remove();

    if (!resp.ok) {
      let detail = '请求失败 (' + resp.status + ')';
      try { const err = await resp.json(); detail = err.detail || detail; } catch {}
      appendMessageDOM('error', detail);
      loading = false;
      return;
    }
    const data = await resp.json();
    const reply = data.choices?.[0]?.message?.content || '（空回复）';
    appendMessageDOM('assistant', reply);
  } catch (err) {
    const typing = document.getElementById('typing-indicator');
    if (typing) typing.remove();
    appendMessageDOM('error', '连接失败: ' + err.message + '。检查 AC Server 是否在运行。');
  } finally {
    loading = false;
  }
});

document.getElementById('btnNewTab').addEventListener('click', newTab);

// ── init ──
loadSessions();
renderTabs();
renderMessages();

// keyboard shortcut: Ctrl+Shift+N for new tab
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.shiftKey && e.key === 'N') { e.preventDefault(); newTab(); }
});
</script>
</body>
</html>
