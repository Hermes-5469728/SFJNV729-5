  <h1>开始写博客</h1>

<div class="post-content">
<p>考虑了很久要不要开一个个人博客。</p>
<p>社交媒体太吵，朋友圈太浅，GitHub 又太冷。想找一个地方，可以安安静静地写点东西——不用顾虑格式、不用在意阅读量、不用解释给谁看。</p>
<p>博客大概是最后一个这样的地方。</p>
<p>这里会有的内容：技术笔记、读书摘录、日常观察、一些没想清楚但值得记下来的想法。</p>
<p>这里不会有的内容：标题党、热点评论、年终总结。</p>
<p>就这样开始吧。</p>
